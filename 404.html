<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · Matheus Costa Francisco</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <main
      id="main"
      class="mx-auto flex min-h-[100dvh] w-full max-w-xl flex-col items-center justify-center gap-8 px-6 py-12 text-center"
    >
      <h1 class="text-display font-bold text-accent-700">404</h1>
      <div lang="en" class="flex flex-col gap-2">
        <p class="text-xl font-semibold">Page not found</p>
        <p class="text-base text-fg-muted">
          The page you are looking for does not exist or has moved.
        </p>
      </div>
      <div lang="pt-BR" class="flex flex-col gap-2">
        <p class="text-xl font-semibold">Página não encontrada</p>
        <p class="text-base text-fg-muted">
          A página que você procura não existe ou mudou de endereço.
        </p>
      </div>
      <nav lang="en" aria-label="English">
        <ul class="flex flex-wrap justify-center gap-3">
          <li>
            <a
              href="/en/"
              hreflang="en"
              class="inline-block rounded-2xl px-5 py-3 text-sm font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-600 bg-accent-600 text-on-accent shadow-sm hover:bg-accent-700 active:bg-accent-800"
            >
              Home
            </a>
          </li>
          <li>
            <a
              href="/en/journey/"
              hreflang="en"
              class="inline-block rounded-2xl px-5 py-3 text-sm font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-600 border border-accent-600 text-accent-700 hover:bg-accent-50 active:bg-accent-100"
            >
              Journey
            </a>
          </li>
          <li>
            <a
              href="/en/books/"
              hreflang="en"
              class="inline-block rounded-2xl px-5 py-3 text-sm font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-600 border border-accent-600 text-accent-700 hover:bg-accent-50 active:bg-accent-100"
            >
              Books
            </a>
          </li>
        </ul>
      </nav>
      <nav lang="pt-BR" aria-label="Português (Brasil)">
        <ul class="flex flex-wrap justify-center gap-3">
          <li>
            <a
              href="/pt/"
              hreflang="pt-BR"
              class="inline-block rounded-2xl px-5 py-3 text-sm font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-600 bg-accent-600 text-on-accent shadow-sm hover:bg-accent-700 active:bg-accent-800"
            >
              Início
            </a>
          </li>
          <li>
            <a
              href="/pt/jornada/"
              hreflang="pt-BR"
              class="inline-block rounded-2xl px-5 py-3 text-sm font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-600 border border-accent-600 text-accent-700 hover:bg-accent-50 active:bg-accent-100"
            >
              Jornada
            </a>
          </li>
          <li>
            <a
              href="/pt/livros/"
              hreflang="pt-BR"
              class="inline-block rounded-2xl px-5 py-3 text-sm font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-600 border border-accent-600 text-accent-700 hover:bg-accent-50 active:bg-accent-100"
            >
              Livros
            </a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
