<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Colors mirror color-accent-600 (light) and color-accent-700 / color-on-accent (dark) in src/index.css; change them together. Follows prefers-color-scheme, not the site theme switcher. -->
  <style>
    .tile { fill: #0f7c72; }
    .mark { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #62d4c2; }
      .mark { stroke: #052725; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="8"/>
  <path class="mark" d="M8.5 23V9.5l7.5 9 7.5-9V23" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
