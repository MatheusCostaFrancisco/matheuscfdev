<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roadmap de estudos 2027 · Matheus Costa Francisco</title>
    <meta
      name="description"
      content="Meu roadmap de estudos 2027: de Senior Front-End Engineer a Product Engineer full-stack com IA, um tema por trimestre e um entregável público para cada um."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The ROUTE_URL placeholders are filled at build time from SITE_URL (ADR 0003) and the route map in src/lib/routes.ts (ADR 0005) -->
    <link vite-ignore rel="canonical" href="%ROUTE_URL%" />
    <link vite-ignore rel="alternate" hreflang="en" href="%ROUTE_URL:en%" />
    <link vite-ignore rel="alternate" hreflang="pt-BR" href="%ROUTE_URL:pt-BR%" />
    <link vite-ignore rel="alternate" hreflang="x-default" href="%ROUTE_URL:x-default%" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="%ROUTE_URL%" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="Roadmap de estudos 2027 · Matheus Costa Francisco" />
    <meta
      property="og:description"
      content="Meu roadmap de estudos 2027: de Senior Front-End Engineer a Product Engineer full-stack com IA, um tema por trimestre e um entregável público para cada um."
    />
    <meta property="og:image" content="/content/assets/profile.jpg" />
    <meta property="og:image:alt" content="Retrato de Matheus Costa Francisco" />

    <!-- Body text weight, self-hosted (ADR 0004). Keep in sync with src/index.css. -->
    <link
      rel="preload"
      href="/fonts/poppins-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
