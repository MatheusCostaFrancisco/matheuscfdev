<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matheus Costa Francisco · Engenheiro de Software Front-End Sênior</title>
    <meta
      name="description"
      content="Engenheiro de Software Front-End Sênior com %YEARS_DEV_PT% construindo interfaces web e mobile em produção. React, TypeScript, Vue.js, React Native e Node.js."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Os placeholders ROUTE_URL são preenchidos no build a partir de SITE_URL (ADR 0003) e do mapa de rotas em src/lib/routes.ts (ADR 0005) -->
    <link vite-ignore rel="canonical" href="%ROUTE_URL%" />
    <link vite-ignore rel="alternate" hreflang="en" href="%ROUTE_URL:en%" />
    <link vite-ignore rel="alternate" hreflang="pt-BR" href="%ROUTE_URL:pt-BR%" />
    <link vite-ignore rel="alternate" hreflang="x-default" href="%ROUTE_URL:x-default%" />

    <meta property="og:type" content="profile" />
    <meta property="og:url" content="%ROUTE_URL%" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta
      property="og:title"
      content="Matheus Costa Francisco · Engenheiro de Software Front-End Sênior"
    />
    <meta
      property="og:description"
      content="Engenheiro de Software Front-End Sênior com %YEARS_DEV_PT% construindo interfaces web e mobile em produção. React, TypeScript, Vue.js, React Native e Node.js."
    />
    <meta property="og:image" content="/content/assets/profile.jpg" />
    <meta property="og:image:alt" content="Retrato de Matheus Costa Francisco" />

    <!-- Body text weight, self-hosted (ADR 0004). Keep in sync with src/index.css. -->
    <link
      rel="preload"
      href="/fonts/poppins-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
