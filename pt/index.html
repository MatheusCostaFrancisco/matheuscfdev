<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matheus Costa Francisco · Engenheiro de Software Front-End Sênior</title>
    <meta
      name="description"
      content="Engenheiro de Software Front-End Sênior com %YEARS_DEV_PT% construindo interfaces web e mobile em produção. React, TypeScript, Vue.js, React Native e Node.js."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- O placeholder SITE_URL é preenchido no build a partir de .env.production (ADR 0003) -->
    <link vite-ignore rel="canonical" href="%SITE_URL%/pt/" />
    <link vite-ignore rel="alternate" hreflang="en" href="%SITE_URL%/en/" />
    <link vite-ignore rel="alternate" hreflang="pt-BR" href="%SITE_URL%/pt/" />
    <link vite-ignore rel="alternate" hreflang="x-default" href="%SITE_URL%/" />

    <meta property="og:type" content="profile" />
    <meta property="og:url" content="%SITE_URL%/pt/" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta
      property="og:title"
      content="Matheus Costa Francisco · Engenheiro de Software Front-End Sênior"
    />
    <meta
      property="og:description"
      content="Engenheiro de Software Front-End Sênior com %YEARS_DEV_PT% construindo interfaces web e mobile em produção. React, TypeScript, Vue.js, React Native e Node.js."
    />
    <meta property="og:image" content="/content/assets/profile.jpg" />
    <meta property="og:image:alt" content="Retrato de Matheus Costa Francisco" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <!--
      lang="en" on #root: the rendered content is still English until T-018
      translates it (WCAG 3.1.1). Remove the attribute in T-018.
    -->
    <div id="root" lang="en"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
